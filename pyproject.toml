[project]
name = "gong-e-qc"
version = "0.1.0"
description = "Synthetic anti-money-laundering review and evidence workbench"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "langgraph>=1,<2", "jsonpatch==1.33", "jsonpointer==3.1.1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
